<!DOCTYPE html><html lang="ar" dir="rtl"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>مانجا ويف</title>  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" media="print" onload="this.media='all'">  <link rel="stylesheet" href="css/style.css"></head><body>  <header class="top">    <a href="index.html" class="logo">🌊 مانجا <span>ويف</span></a>    <nav class="nav">      <span id="userChip" class="user-chip"></span>      <a href="index.html">الرئيسية</a>    </nav>  </header>  <main>    <section id="detail"><div class="empty">⏳ جارِ التحميل...</div></section>    <section class="sec">      <h2 class="sec-title">📖 الفصول <span class="count" id="chCount"></span></h2>      <div id="chList" class="ch-list"></div>      <div id="chEmpty" class="empty" hidden>مفيش فصول بعد</div>    </section>  </main>  <script type="module">    import { db, auth } from './js/firebase.js';    import { getManga, getChapters, fmtDate } from './js/app.js';    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";    import { doc, getDoc, setDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";    const $ = id => document.getElementById(id);    const id = new URLSearchParams(location.search).get('id');    const detail = $('detail');    if(!id){      detail.innerHTML = '<div class="empty">مانجا غير موجودة</div>';    } else {      (async () => {        const manga = await getManga(id);        if(!manga){          detail.innerHTML = '<div class="empty">⚠️ المانجا دي مش موجودة</div>';          return;        }        document.title = (manga.titleAr || manga.titleEn) + ' — مانجا ويف';        detail.innerHTML = `          <div class="d-top">            <div class="d-cover"><img src="${manga.cover || ''}" alt="${manga.titleAr || ''}"></div>            <div class="d-info">              <h1>${manga.titleAr || manga.titleEn}</h1>              ${manga.titleEn ? '<h3>' + manga.titleEn + '</h3>' : ''}              <p>${manga.descAr || manga.descEn || 'مفيش وصف'}</p>              <div class="d-meta">                ${(manga.genres || []).map(g => '<span>#' + g + '</span>').join('')}                <span>📅 ${fmtDate(manga.updatedAt)}</span>                ${manga.lastChapter ? '<span>📖 الفصل ' + manga.lastChapter + '</span>' : ''}              </div>              <button id="favBtn" class="btn ghost" style="margin-top:12px">❤️ أضف للمفضلة</button>            </div>          </div>`;        const favBtn = $('favBtn');        let favState = false;        async function loadFav(user){          const snap = await getDoc(doc(db, 'users', user.uid));          const favs = (snap.data() && snap.data().favs) || [];          favState = favs.includes(id);          favBtn.textContent = favState ? '❤️ في المفضلة' : '🤍 أضف للمفضلة';        }        onAuthStateChanged(auth, user => {          if(user) loadFav(user);          else favBtn.textContent = '❤️ أضف للمفضلة (سجّل الدخول)';        });        favBtn.onclick = async () => {          const user = auth.currentUser;          if(!user){ location.href = 'login.html'; return; }          favState = !favState;          const ref = doc(db, 'users', user.uid);          await setDoc(ref, { favs: favState ? arrayUnion(id) : arrayRemove(id) }, { merge: true });          favBtn.textContent = favState ? '❤️ في المفضلة' : '🤍 أضف للمفضلة';        };        const chapters = await getChapters(id);        const list = $('chList'), count = $('chCount'), empty = $('chEmpty');        if(chapters.length === 0){          empty.hidden = false;        } else {          count.textContent = '(' + chapters.length + ')';          list.innerHTML = chapters.map(c => `            <a class="ch" href="reader.html?manga=${id}&chapter=${c.number}">              <b>الفصل ${c.number}</b>              <small>${fmtDate(c.createdAt)}</small>            </a>`).join('');        }      })();    }  </script></body></html>
