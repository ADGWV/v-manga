<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — مانجا ويف</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">🌊 مانجا <span>ويف</span></div>

    <div class="tabs">
      <button id="tabLogin" class="tab on">تسجيل الدخول</button>
      <button id="tabSignup" class="tab">حساب جديد</button>
    </div>

    <button id="googleBtn" class="btn google-btn block" type="button">🟦 تسجيل بجوجل</button>

    <form id="loginForm" class="auth-form">
      <label>الإيميل</label>
      <input id="loginEmail" type="email" required placeholder="you@email.com">
      <label>الباسورد</label>
      <input id="loginPass" type="password" required placeholder="••••••••">
      <button class="btn block" type="submit" style="margin-top:14px">دخول</button>
      <p id="loginMsg" class="auth-msg"></p>
    </form>

    <form id="signupForm" class="auth-form" hidden>
      <label>الاسم</label>
      <input id="suName" type="text" placeholder="اسمك">
      <label>الإيميل</label>
      <input id="suEmail" type="email" required placeholder="you@email.com">
      <label>الباسورد</label>
      <input id="suPass" type="password" required minlength="6" placeholder="6 أحرف على الأقل">
      <button class="btn block" type="submit" style="margin-top:14px">إنشاء الحساب</button>
      <p id="suMsg" class="auth-msg"></p>
    </form>

    <a href="index.html" class="logout" style="margin-top:16px">↩️ متابعة التصفح من غير حساب</a>
  </div>

  <script type="module">
    import { auth, googleProvider } from './js/firebase.js';
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const $ = id => document.getElementById(id);

    onAuthStateChanged(auth, user => { if(user) location.href = 'index.html'; });

    function show(login){
      $('tabLogin').classList.toggle('on', login);
      $('tabSignup').classList.toggle('on', !login);
      $('loginForm').hidden = !login;
      $('signupForm').hidden = login;
    }
    $('tabLogin').onclick  = () => show(true);
    $('tabSignup').onclick = () => show(false);

    $('loginForm').onsubmit = async e => {
      e.preventDefault();
      $('loginMsg').textContent = '';
      try{
        await signInWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPass').value);
      }catch(err){
        $('loginMsg').textContent =
          (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential')
          ? 'الإيميل أو الباسورد غلط' : err.message;
      }
    };

    $('signupForm').onsubmit = async e => {
      e.preventDefault();
      $('suMsg').textContent = '';
      try{
        const cred = await createUserWithEmailAndPassword(auth, $('suEmail').value.trim(), $('suPass').value);
        if($('suName').value.trim())
          await updateProfile(cred.user, { displayName: $('suName').value.trim() });
      }catch(err){
        $('suMsg').textContent =
          err.code === 'auth/email-already-in-use' ? 'الإيميل ده مسجل قبل كده' : err.message;
      }
    };

    $('googleBtn').onclick = async () => {
      try{
        await signInWithPopup(auth, googleProvider);
      }catch(err){
        console.error('Google error:', err.code, err.message);
        $('loginMsg').textContent = 'خطأ: ' + (err.code || err.message);
      }
    };
  </script>
</body>
</html>
