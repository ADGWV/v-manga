<!DOCTYPE html><html lang="ar" dir="rtl"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>البروفايل — مانجا ويف</title>  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" media="print" onload="this.media='all'">  <link rel="stylesheet" href="css/style.css"></head><body>  <header class="top">    <a href="index.html" class="logo">🌊 مانجا <span>ويف</span></a>    <nav class="nav"><a href="index.html">الرئيسية</a></nav>  </header>  <main class="panel">    <div class="card profile-card">      <div id="pAvatar" class="profile-avatar">?</div>      <h2 id="pName">...</h2>      <p id="pEmail" style="color:var(--dim);margin:4px 0 20px">...</p>      <a href="settings.html" class="btn block">⚙️ الإعدادات</a>      <a href="index.html" class="btn ghost block" style="margin-top:10px">🏠 الرئيسية</a>      <button id="logoutBtn" class="btn red block" style="margin-top:10px">تسجيل الخروج</button>    </div>  </main>  <script type="module">    import { auth } from './js/firebase.js';    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";    const $ = id => document.getElementById(id);    onAuthStateChanged(auth, user => {      if(!user){ location.href = 'login.html'; return; }      if(user.photoURL){        $('pAvatar').innerHTML = `<img src="${user.photoURL}" alt="">`;      } else {        $('pAvatar').textContent = ((user.displayName || user.email || '?')[0] || '?').toUpperCase();      }      $('pName').textContent = user.displayName || 'مستخدم';      $('pEmail').textContent = user.email;    });    $('logoutBtn').onclick = () => signOut(auth);  </script></body></html>
