<!DOCTYPE html><html lang="ar" dir="rtl"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>لوحة التحكم — مانجا ويف</title>  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" media="print" onload="this.media='all'">  <link rel="stylesheet" href="css/style.css">  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body>  <header class="top">    <a href="index.html" class="logo">🌊 مانجا <span>ويف</span></a>    <nav class="nav"><a href="index.html">الرئيسية</a></nav>  </header>  <main class="panel">    <div id="login" class="card">      <h2>🔐 دخول الأدمن</h2>      <label>الإيميل</label>      <input id="email" type="email" placeholder="admin@email.com">      <label>الباسورد</label>      <input id="pass" type="password" placeholder="••••••••">      <button id="loginBtn" class="btn block" style="margin-top:14px">تسجيل الدخول</button>      <p id="loginErr" class="hint" style="color:#e63946"></p>    </div>    <div id="panel" hidden>      <div class="card">        <h2>📚 إضافة مانجا</h2>        <label>الاسم (عربي) *</label>        <input id="mAr" placeholder="مثال: ون بيس">        <label>الاسم (إنجليزي)</label>        <input id="mEn" placeholder="One Piece">        <label>الوصف (عربي)</label>        <textarea id="dAr" placeholder="وصف بالعربي..."></textarea>        <label>الوصف (إنجليزي) — اختياري</label>        <textarea id="dEn" placeholder="Description..."></textarea>        <label>التصنيفات (افصل بينها بفاصلة)</label>        <input id="mGenres" placeholder="أكشن، مغامرة، كوميدي">        <label>صورة الغلاف (اختر من الجهاز)</label>        <div class="cover-pick">          <label class="file-btn">📁 اختيار صورة            <input id="mCover" type="file" accept="image/*" hidden>          </label>          <img id="coverPrev" class="cover-prev" alt="" hidden>        </div>        <button id="addManga" class="btn block" style="margin-top:14px">➕ إضافة المانجا</button>        <p id="mMsg" class="hint"></p>      </div>      <div class="card">        <h2>📖 إضافة فصل</h2>        <label>المانجا</label>        <div class="pick" id="pickBox">          <button type="button" class="pick-btn" id="pickBtn">اختار المانجا ▼</button>          <div class="pick-list" id="pickList" hidden></div>        </div>        <label>رقم الفصل</label>        <input id="cNum" type="number" min="1" placeholder="1">        <label>الصور أو ملف ZIP</label>        <label class="file-btn">📁 اختيار الصور / ZIP          <input id="cFiles" type="file" accept="image/*,.zip,application/zip" multiple hidden>        </label>        <p id="fileInfo" class="hint">لم يتم اختيار أي ملف</p>        <p id="prog" class="hint"></p>        <button id="addChap" class="btn block" style="margin-top:14px">➕ إضافة الفصل</button>        <p id="cMsg" class="hint"></p>      </div>      <div class="card">        <h2>🗂️ المانجا الموجودة</h2>        <div id="mList"></div>      </div>      <a id="logout" class="logout">تسجيل الخروج</a>    </div>  </main>  <script type="module">    import { db, auth, isAdmin, uploadToCloud } from './js/firebase.js';    import { collection, addDoc, getDocs, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";    import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";    const $ = id => document.getElementById(id);    onAuthStateChanged(auth, user => {      if(user && isAdmin(user)){        $('login').hidden = true;        $('panel').hidden = false;        loadMangaSelect(); loadMangaList();      } else if(user){        $('login').hidden = false; $('panel').hidden = true;        $('loginErr').textContent = 'هذا الحساب ليس أدمن';      } else {        $('login').hidden = false; $('panel').hidden = true;      }    });    $('loginBtn').onclick = async () => {      try{ await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value); }      catch(e){ $('loginErr').textContent = 'الإيميل أو الباسورد غلط'; }    };    $('logout').onclick = () => signOut(auth);    function sortNames(names){      return names.sort((a,b) => a.localeCompare(b, undefined, {numeric:true}));    }    let selectedManga = '';    async function loadMangaSelect(){      const snap = await getDocs(collection(db,'mangas'));      const list = snap.docs.map(d => ({id:d.id, ...d.data()}));      $('pickList').innerHTML = list.map(m => `        <button type="button" class="pick-item" data-id="${m.id}">          ${m.cover ? `<img src="${m.cover}" alt="">` : '<span class="pick-noimg">📕</span>'}          <span><b>${m.titleAr || m.titleEn}</b><small>${m.titleEn || ''}</small></span>        </button>`).join('');      document.querySelectorAll('.pick-item').forEach(b => {        b.onclick = () => {          selectedManga = b.dataset.id;          $('pickBtn').textContent = b.querySelector('b').textContent + ' ▼';          $('pickList').hidden = true;        };      });    }    $('pickBtn').onclick = () => { $('pickList').hidden = !$('pickList').hidden; };    document.addEventListener('click', e => {      if(!$('pickBox').contains(e.target)) $('pickList').hidden = true;    });    $('mCover').onchange = e => {      const f = e.target.files[0];      const p = $('coverPrev');      p.hidden = !f;      if(f) p.src = URL.createObjectURL(f);    };    $('cFiles').onchange = e => {      const fs = [...e.target.files];      $('fileInfo').textContent = fs.length === 0 ? 'لم يتم اختيار أي ملف' : '✅ تم اختيار ' + fs.length + ' ملف';    };    async function loadMangaList(){      const snap = await getDocs(collection(db,'mangas'));      const list = snap.docs.map(d => ({id:d.id, ...d.data()}));      $('mList').innerHTML = list.map(m => `        <div class="ch">          <b>${m.titleAr || m.titleEn}</b>          <button class="chip-btn" data-del="${m.id}">🗑️</button>        </div>`).join('');      document.querySelectorAll('[data-del]').forEach(btn => {        btn.onclick = async () => {          if(!confirm('تمسح المانجا دي؟')) return;          await deleteDoc(doc(db,'mangas',btn.dataset.del));          loadMangaList(); loadMangaSelect();        };      });    }    $('addManga').onclick = async () => {      const titleAr = $('mAr').value.trim();      if(!titleAr){ $('mMsg').textContent = 'اكتب الاسم بالعربي أولاً'; return; }      const coverFile = $('mCover').files[0];      $('mMsg').textContent = '⏳ جارِ الرفع...';      try{        let cover = '';        if(coverFile) cover = await uploadToCloud(coverFile);        const genres = $('mGenres').value.split(',').map(s=>s.trim()).filter(Boolean);        await addDoc(collection(db,'mangas'), {          titleAr, titleEn: $('mEn').value.trim(),          descAr: $('dAr').value.trim(), descEn: $('dEn').value.trim(),          genres, cover, updatedAt: serverTimestamp()        });        $('mMsg').textContent = '✅ اتضافت المانجا';        ['mAr','mEn','dAr','dEn','mGenres'].forEach(i=>$(i).value='');        $('mCover').value = ''; $('coverPrev').hidden = true;        loadMangaSelect(); loadMangaList();      }catch(e){ $('mMsg').textContent = '⚠️ ' + e.message; }    };    $('addChap').onclick = async () => {      const mangaId = selectedManga;      const num = Number($('cNum').value);      const files = [...$('cFiles').files];      if(!mangaId || !num || files.length === 0){        $('cMsg').textContent = 'اختار المانجا + رقم الفصل + الصور/الملف';        return;      }      $('cMsg').textContent = '';      $('prog').textContent = '⏳ جارِ التجهيز...';      try{        let images = [];        const zip = files.find(f => f.name.toLowerCase().endsWith('.zip'));        if(zip){          const jz = await JSZip.loadAsync(zip);          const names = Object.keys(jz.files)            .filter(n => !jz.files[n].dir && /\.(png|jpe?g|webp|gif)$/i.test(n));          sortNames(names);          images = names.map(n => ({ blob: jz.files[n] }));        } else {          images = files.filter(f => /\.(png|jpe?g|webp|gif)$/i.test(f.name));          sortNames(images);        }        if(images.length === 0){          $('prog').textContent = ''; $('cMsg').textContent = 'مفيش صور في الملف'; return;        }        const urls = [];        for(let i=0; i<images.length; i++){          $('prog').textContent = '⏳ رفع ' + (i+1) + ' من ' + images.length + '...';          const it = images[i];          const file = it.blob ? await it.blob.async('blob') : it;          urls.push(await uploadToCloud(file));        }        await addDoc(collection(db,'chapters'), { mangaId, number: num, pages: urls, createdAt: serverTimestamp() });        await updateDoc(doc(db,'mangas',mangaId), { lastChapter: num, updatedAt: serverTimestamp() });        $('prog').textContent = '';        $('cMsg').textContent = '✅ اتضاف الفصل ' + num + ' (' + urls.length + ' صورة)';        $('cNum').value = ''; $('cFiles').value = ''; $('fileInfo').textContent = 'لم يتم اختيار أي ملف';      }catch(e){        $('prog').textContent=''; $('cMsg').textContent = '⚠️ ' + e.message;      }    };  </script></body></html>
