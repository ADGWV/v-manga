<!DOCTYPE html><html lang="ar" dir="rtl"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>الإعدادات — مانجا ويف</title>  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" media="print" onload="this.media='all'">  <link rel="stylesheet" href="css/style.css"></head><body>  <header class="top">    <a href="index.html" class="logo">🌊 مانجا <span>ويف</span></a>    <nav class="nav"><a href="index.html">الرئيسية</a></nav>  </header>  <main class="panel">    <h2 style="font-size:20px;font-weight:800;margin-bottom:14px">⚙️ الإعدادات</h2>    <div class="card">      <h2>👤 تعديل البروفايل</h2>      <label>الاسم</label>      <input id="setName" placeholder="اسمك">      <label>رابط الصورة الشخصية</label>      <input id="setPhoto" placeholder="https://...">      <button id="saveProfile" class="btn block" style="margin-top:14px">💾 حفظ التعديلات</button>      <p id="profMsg" class="auth-msg"></p>    </div>    <div class="card">      <h2>🔑 تغيير الباسورد</h2>      <label>الباسورد الحالي</label>      <input id="curPass" type="password" placeholder="••••••••">      <label>الباسورد الجديد</label>      <input id="newPass" type="password" minlength="6" placeholder="6 أحرف على الأقل">      <button id="savePass" class="btn red block" style="margin-top:14px">تغيير الباسورد</button>      <p id="passMsg" class="auth-msg"></p>    </div>    <a href="profile.html" class="logout">↩️ الرجوع للبروفايل</a>  </main>  <script type="module">    import { auth } from './js/firebase.js';    import { onAuthStateChanged, updateProfile, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";    const $ = id => document.getElementById(id);    onAuthStateChanged(auth, user => {      if(!user){ location.href = 'login.html'; return; }      $('setName').value = user.displayName || '';      $('setPhoto').value = user.photoURL || '';    });    $('saveProfile').onclick = async () => {      const user = auth.currentUser;      if(!user) return;      $('profMsg').style.color = '#e63946';      $('profMsg').textContent = '';      try{        await updateProfile(user, {          displayName: $('setName').value.trim() || null,          photoURL: $('setPhoto').value.trim() || null        });        $('profMsg').style.color = '#4ade80';        $('profMsg').textContent = '✅ اتحدث البروفايل';      }catch(err){ $('profMsg').textContent = '⚠️ ' + err.message; }    };    $('savePass').onclick = async () => {      const user = auth.currentUser;      if(!user) return;      $('passMsg').style.color = '#e63946';      $('passMsg').textContent = '';      const isPassword = (user.providerData || []).some(p => p.providerId === 'password');      if(!isPassword){        $('passMsg').textContent = 'حسابك مسجل بجوجل — غيّر الباسورد من إعدادات جوجل';        return;      }      const cur = $('curPass').value;      const nw = $('newPass').value;      if(!cur || nw.length < 6){        $('passMsg').textContent = 'اكتب الباسورد الحالي والجديد (6 أحرف على الأقل)';        return;      }      try{        await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, cur));        await updatePassword(user, nw);        $('passMsg').style.color = '#4ade80';        $('passMsg').textContent = '✅ اتغير الباسورد';        $('curPass').value = ''; $('newPass').value = '';      }catch(err){        $('passMsg').textContent = err.code === 'auth/wrong-password' ? 'الباسورد الحالي غلط' : '⚠️ ' + err.message;      }    };  </script></body></html>
