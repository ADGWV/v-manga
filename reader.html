<!DOCTYPE html><html lang="ar" dir="rtl"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>القارئ — مانجا ويف</title>  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>">  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" media="print" onload="this.media='all'">  <link rel="stylesheet" href="css/style.css"></head><body>  <header class="r-top">    <a id="backLink" href="#">↩️</a>    <div class="r-title" id="rTitle">جارِ التحميل...</div>    <a href="index.html">🏠</a>  </header>  <div class="reader" id="pages"></div>  <div class="r-nav" id="nav">    <a id="prev" class="btn ghost" href="#">السابق</a>    <a id="next" class="btn" href="#">التالي</a>  </div>  <script type="module">    import { getManga, getChapters } from './js/app.js';    (async () => {      const params = new URLSearchParams(location.search);      const mangaId = params.get('manga');      const chapterNum = Number(params.get('chapter'));      const pages = document.getElementById('pages');      const title = document.getElementById('rTitle');      const back  = document.getElementById('backLink');      const nav   = document.getElementById('nav');      const prev  = document.getElementById('prev');      const next  = document.getElementById('next');      pages.innerHTML = '<div class="empty">⏳ جارِ تحميل الفصل...</div>';      if(!mangaId || !chapterNum){        pages.innerHTML = '<div class="empty">رابط غير صحيح</div>';        return;      }      const manga = await getManga(mangaId);      if(!manga){        pages.innerHTML = '<div class="empty">المانجا مش موجودة</div>';        return;      }      back.href = 'manga.html?id=' + mangaId;      document.title = 'الفصل ' + chapterNum + ' — ' + (manga.titleAr || manga.titleEn);      const chapters = await getChapters(mangaId);      const chapter = chapters.find(c => c.number === chapterNum);      if(!chapter || !chapter.pages || chapter.pages.length === 0){        title.textContent = manga.titleAr || manga.titleEn;        pages.innerHTML = '<div class="empty">الفصل ده مفيش صور بعد</div>';        nav.hidden = true;        return;      }      title.textContent = (manga.titleAr || manga.titleEn) + ' — الفصل ' + chapterNum;      pages.innerHTML = chapter.pages.map(p => `<img src="${p}" alt="" loading="lazy">`).join('');      const idx = chapters.findIndex(c => c.number === chapterNum);      if(idx > 0) prev.href = 'reader.html?manga=' + mangaId + '&chapter=' + chapters[idx-1].number;      else prev.style.visibility = 'hidden';      if(idx < chapters.length - 1) next.href = 'reader.html?manga=' + mangaId + '&chapter=' + chapters[idx+1].number;      else next.style.visibility = 'hidden';    })();  </script></body></html>
